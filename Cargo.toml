[package]
edition = "2021"
name = "ft3x68-rs"
rust-version = "1.86"
version = "0.1.2"
description = "A Rust driver for the FT3x68 touch controllers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theembeddedrustacean/ft3x68-rs"
keywords = ["embedded", "touch", "ft3x68", "no_std"]
categories = ["embedded"]
readme = "README.md"
exclude = ["target/debug/*", "examples/"]
homepage = "https://blog.theembeddedrustacean.com/"

[lib]
name = "ft3x68_rs"
path = "./src/lib.rs"

[dependencies]
embedded-hal = "1.0.0"
heapless = "0.8"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = [
  "eh1",
] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
